name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Front-end tests (network disabled)
        working-directory: frontend
        run: sudo unshare --net -- sudo -u "$USER" env "PATH=$PATH" node --test "tests/*.test.mjs"
      - name: Tests (network disabled)
        run: |
          # Tests must not need the network: block outbound connections for pytest.
          # Node is on PATH, so the front-end contract tests run here too.
          sudo unshare --net -- sudo -u "$USER" env "PATH=$PATH" python -m pytest
