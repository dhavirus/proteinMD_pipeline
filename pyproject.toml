[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "simprep"
version = "0.1.0"
description = "Turn a protein structure into a curated, documented simulation system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gemmi==0.7.5",
    "jsonschema==4.26.0",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
dev = [
    "nbformat==5.11.1",
    "pytest==9.0.2",
    "ruff==0.15.8",
]

[project.scripts]
simprep = "simprep.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simprep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]
